[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "contour-research"
version = "1.0.0"
description = "Epistemic ML Research Framework (Goals, Claims, Runs)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
contour = "contour.cli:main"
cr = "contour.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
