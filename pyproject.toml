[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "contour-research"
version = "0.2.0"
description = "Topographical & Epistemic ML Research Framework (Expeditions, Cairns, FieldLogs)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
aim = ["aim>=3.17.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
contour = "contour.cli:main"
cr = "contour.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
